# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Settings go in deploy/.env (copy deploy/.env.example); SECRETS_KEY is needed.
# The database and backups are in the "data" volume. Phones and other
# devices on the home network open http(s)://<this computer's IP>:8000.
# BIND_ADDRESS (deploy/.env) picks the host address the port is published on;
# empty means every address. Behind a reverse proxy on this machine set
# 127.0.0.1 (docs/DEPLOY-LINUX.md, section 5).

services:
  smart-home:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: smart-home
    env_file:
      - path: .env
        required: false
    ports:
      - "${BIND_ADDRESS:+${BIND_ADDRESS}:}8000:8000"
    volumes:
      - data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # On a Linux host, uncomment to let Wake-on-LAN reach the TVs (a
    # broadcast does not leave Docker's own network); then remove "ports".
    # network_mode: host

volumes:
  data:
