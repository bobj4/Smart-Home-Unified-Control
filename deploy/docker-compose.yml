# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Settings go in deploy/.env (copy deploy/.env.example); SECRETS_KEY is needed.
# The database and backups are in the "data" volume. Phones and other
# devices on the home network open http(s)://<this computer's IP>:8000.

services:
  smart-home:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: smart-home
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # On a Linux host, uncomment to let Wake-on-LAN reach the TVs (a
    # broadcast does not leave Docker's own network); then remove "ports".
    # network_mode: host

volumes:
  data:
