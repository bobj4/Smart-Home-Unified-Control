# Apache in front of Smart Home Unified Control, on the same server.
#   deploy/linux/smarthome install --access proxy
#   deploy/linux/smarthome proxy-example apache your.domain  > /etc/httpd/conf.d/smarthome.conf
# Needs mod_ssl, mod_proxy, mod_proxy_http and mod_headers (Rocky/RHEL:
# dnf install httpd mod_ssl; Debian/Ubuntu: a2enmod ssl proxy proxy_http headers).
# Certificate: certbot --apache -d smarthome.example.com, or your own files.
# SELinux (Rocky/RHEL): setsebool -P httpd_can_network_connect 1

<VirtualHost *:80>
    ServerName smarthome.example.com
    Redirect permanent / https://smarthome.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName smarthome.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/smarthome.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/smarthome.example.com/privkey.pem

    # The app sets its own security headers; Apache adds X-Forwarded-For,
    # which the app believes only from this proxy (FORWARDED_ALLOW_IPS).
    # Do not add X-Forwarded-Proto: the app's Settings > Admin > HTTPS status
    # would then say its own HTTPS is on.
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/ timeout=60
    ProxyPassReverse / http://127.0.0.1:8000/
    ProxyErrorOverride Off

    # The app uses PUT, PATCH and DELETE. The default OWASP rules of
    # ModSecurity allow only GET, HEAD, POST and OPTIONS (rule 911100).
    <IfModule security2_module>
        SecRuleRemoveById 911100
    </IfModule>

    # A plain page while the app is stopped or updating.
    ErrorDocument 503 "Smart Home is restarting. Try again in a minute."
</VirtualHost>
