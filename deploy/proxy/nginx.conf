# nginx in front of Smart Home Unified Control, on the same server.
#   deploy/linux/smarthome install --access proxy
#   deploy/linux/smarthome proxy-example nginx your.domain  > /etc/nginx/conf.d/smarthome.conf
# Certificate: certbot --nginx -d smarthome.example.com, or your own files.
# SELinux (Rocky/RHEL): setsebool -P httpd_can_network_connect 1

server {
    listen 80;
    server_name smarthome.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name smarthome.example.com;

    ssl_certificate     /etc/letsencrypt/live/smarthome.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smarthome.example.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Believed only from this proxy (FORWARDED_ALLOW_IPS). No
        # X-Forwarded-Proto: see the note in apache.conf.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering off;  # camera clips stream through
    }
}
